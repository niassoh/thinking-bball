# The team sheet once more, later: the nightly starts this when its team pull came back
# short (sheets-teamcat.js: the sheet mid-reload, its records 0-0 or a column that was
# there missing). A column short alone doesn't hold the rest back: the records and every
# other column are cached, that column kept from the last read. After `wait` minutes this
# nudges and reads the sheet again; whatever it caches is committed and deployed, and while
# it's still short it starts itself again two hours later, `tries` times in all (an hour,
# three and five after the nightly). By hand: gh workflow run team-retry.yml -f wait=0
name: team-retry

on:
  workflow_dispatch:
    inputs:
      wait:
        description: Minutes before the retry
        default: '60'
      tries:
        description: Retries left, this one included
        default: '3'

permissions:
  contents: write
  # To start itself again.
  actions: write

jobs:
  # Outside the nightly's concurrency group, so the wait holds nothing up.
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - run: sleep $(( ${{ inputs.wait }} * 60 ))

  team:
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never alongside the nightly: both drive the production sheet.
    concurrency:
      group: nightly
      cancel-in-progress: false
    env:
      SEASON: ${{ vars.SEASON }}
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: '1'
    steps:
      - run: '[[ "$SEASON" =~ ^[0-9]{4}-[0-9]{2}$ ]]'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: printf '%s' "$GOOGLE_SA_JSON" > privatekey.json
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      - id: team
        run: node sheets-teamcat.js --season="$SEASON"
        timeout-minutes: 20
        continue-on-error: true
      - id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cached-data.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Data: team sheet retry $(date -u +%F)"
          git pull -q --rebase
          git push -q
          echo changed=true >> "$GITHUB_OUTPUT"
      - if: steps.commit.outputs.changed
        run: gh workflow run pages.yml -R niassoh/tbball
        env:
          GH_TOKEN: ${{ secrets.TBBALL_DISPATCH }}
      - if: steps.team.outcome == 'failure' && inputs.tries > 1
        run: gh workflow run team-retry.yml -R "$GITHUB_REPOSITORY" -f wait=120 -f tries=$(( ${{ inputs.tries }} - 1 ))
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.team.outcome == 'failure'
        run: exit 1
